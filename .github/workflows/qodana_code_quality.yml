
name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  qodana-nfl:
    name: Qodana - NFL
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/docs/win/football/nfl/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        id: python-nfl
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/win/football/nfl/requirements.txt

      - name: Install NFL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/football/nfl/requirements.txt

      - name: Verify NFL Python environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip check
          python -c "import pipeline_reporter; print(pipeline_reporter.__file__)"

      - name: Qodana NFL Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python-community
            --within-docker false
            --only-directory docs/win/football/nfl
            --config qodana-nfl.yaml
            --baseline .qodana/baseline.sarif.json
          pr-mode: false
          artifact-name: qodana-nfl
          primary-cache-key: qodana-2026.2-nfl-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-nfl-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_23453728 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ steps.python-nfl.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/docs/win/football/nfl/scripts

  qodana-prop-engine:
    name: Qodana - Prop Engine
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/docs/win/football/prop_engine/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14.5
        id: python-prop
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: docs/win/football/prop_engine/requirements.txt

      - name: Install Prop Engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/football/prop_engine/requirements.txt

      - name: Verify Prop Engine Python environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip check
          python -c "import common; print(common.__file__)"
          python -c "import pipeline_reporter; print(pipeline_reporter.__file__)"

      - name: Qodana Prop Engine Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python-community
            --within-docker false
            --only-directory docs/win/football/prop_engine
            --config qodana-prop-engine.yaml
          pr-mode: false
          artifact-name: qodana-prop-engine
          primary-cache-key: qodana-2026.2-prop-engine-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-prop-engine-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2053302466 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ steps.python-prop.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/docs/win/football/prop_engine/scripts

  qodana-cfb:
    name: Qodana - CFB
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/docs/win/football/cfb/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: python-cfb
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/win/football/cfb/requirements.txt

      - name: Install CFB dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/win/football/cfb/requirements.txt

      - name: Verify CFB Python environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip check
          python -c "import pipeline_reporter; print(pipeline_reporter.__file__)"

      - name: Qodana CFB Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python-community
            --within-docker false
            --only-directory docs/win/football/cfb
            --config qodana-cfb.yaml
          pr-mode: false
          artifact-name: qodana-cfb
          primary-cache-key: qodana-2026.2-cfb-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-cfb-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_CFB }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ steps.python-cfb.outputs.python-path }}
          PYTHONPATH: ${{ github.workspace }}/docs/win/football/cfb/scripts
