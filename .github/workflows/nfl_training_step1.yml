name: NFL Training Step 1

# MANUAL RUN ONLY.
# Builds the 2021-2025 historical core training table,
# appends historical odds/weather fields,
# then adds final-game training targets.
# Input/source files are read-only.
# Output:
# docs/win/football/nfl/training/historical_core_2021_2025.csv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-step-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pandas
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run historical core build
        run: |
          python docs/win/football/nfl/scripts/training/step1.py

      - name: Add historical odds and weather fields
        run: |
          python docs/win/football/nfl/scripts/training/step2.py

      - name: Add final-game targets
        run: |
          python docs/win/football/nfl/scripts/training/step3.py

      - name: Commit training output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/nfl/training/historical_core_2021_2025.csv

          if git diff --cached --quiet; then
            echo "No training output changes to commit."
          else
            git commit -m "Build NFL historical training core"
            git push
          fi
