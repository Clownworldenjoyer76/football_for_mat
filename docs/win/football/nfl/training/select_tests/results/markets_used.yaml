# Isolated NFL historical selection-test configuration.
#
# This file does NOT control the live NFL selection pipeline.
# Edit this file, manually run the included workflow, then inspect results/.


test:
  seasons: [2022, 2023, 2024, 2025]
  input_csv: docs/win/football/nfl/training/backtests/step14_market_independent_probabilities_v4.csv
  results_dir: docs/win/football/nfl/training/select_tests/results


# Same broad defaults as the current live NFL selection settings.
selection_defaults:
  min_ev: 0.00
  min_edge: 0.00
  min_kelly: 0.00
  max_kelly: 0.99
  min_odds_american: -10000
  max_odds_american: 10000
  min_model_prob: 0.00
  max_model_prob: 1.00


markets:

  ###################################################
  # ── Moneyline ────────────────────────────────────
  ###################################################

  moneyline:
    enabled: true
    pick_preference: best_prob
#    best_ev, best_prob, best_kelly
    home:
      enabled: true

      odds_bands:
        - [-10000, -110]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 1.00]

      kelly_bands:
        - [0.00, 0.0299]
        - [0.10, 1.00]

      prob_bands:
        - [0.60, 1.00]

    away:
      enabled: true

      odds_bands:
        - [-299, -150]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 1.00]

      kelly_bands:
        - [0.03, 1.00]

      prob_bands:
        - [0.65, 1.00]


  ###################################################
  # ── Spread ───────────────────────────────────────
  ###################################################

  spread:
    enabled: true
    pick_preference: best_prob
    max_spread_abs: 100.0

    home:
      enabled: true

      line_bands:
        - [-100.0, 100.0]

      odds_bands:
        - [-10000, 10000]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 99.99]

      kelly_bands:
        - [0.00, 1.00]

      prob_bands:
        - [0.00, 1.00]

    away:
      enabled: true

      line_bands:
        - [-100.0, 100.0]

      odds_bands:
        - [-10000, 10000]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 99.99]

      kelly_bands:
        - [0.00, 1.00]

      prob_bands:
        - [0.00, 1.00]


  ###################################################
  # ── Totals ───────────────────────────────────────
  ###################################################

  total:
    enabled: true
    pick_preference: best_prob
    min_total: 0.0
    max_total: 100.0

    over:
      enabled: true

      line_bands:
        - [0.0, 100.0]

      odds_bands:
        - [-10000, 10000]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 99.99]

      kelly_bands:
        - [0.00, 1.00]

      prob_bands:
        - [0.00, 1.00]

    under:
      enabled: true

      line_bands:
        - [0.0, 100.0]

      odds_bands:
        - [-10000, 10000]

      edge_bands:
        - [0.00, 1.00]

      ev_bands:
        - [0.00, 99.99]

      kelly_bands:
        - [0.00, 1.00]

      prob_bands:
        - [0.00, 1.00]


