name: NFL Annual Training Models

# MANUAL RUN OR V3 BRANCH TRIGGER ONLY.
#
# Rebuilds historical training data through Step 10, then builds the isolated
# v3 market-relative candidate stack:
#   Step 4  - leakage sanitization gate
#   Step 11 - market-baseline residual regressors + logit-adjustment classifiers
#   Step 13 - expanding-season out-of-fold market-relative backtest
#   Step 14 - nested chronological shrinkage vs no-vig sportsbook baseline
#
# v3 artifacts remain separate from the current live production files.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nfl-market-relative-v3
    paths:
      - docs/win/football/nfl/training/RUN_V3_TRIGGER.txt

permissions:
  contents: write

jobs:
  annual-training-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy catboost

      - name: Compile rebuilt training scripts
        run: |
          python -m py_compile \
            docs/win/football/nfl/scripts/training/step4.py \
            docs/win/football/nfl/scripts/training/step11.py \
            docs/win/football/nfl/scripts/training/step13.py \
            docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Run historical core build
        run: |
          python docs/win/football/nfl/scripts/training/step1.py

      - name: Add historical odds and weather fields
        run: |
          python docs/win/football/nfl/scripts/training/step2.py

      - name: Add final-game targets
        run: |
          python docs/win/football/nfl/scripts/training/step3.py

      - name: Remove outcome-mined enrichment leakage
        run: |
          python docs/win/football/nfl/scripts/training/step4.py

      - name: Add lagged team statistics
        run: |
          python docs/win/football/nfl/scripts/training/step5.py

      - name: Split historical training table by season
        run: |
          python docs/win/football/nfl/scripts/training/step5_split.py

      - name: Add lagged QB statistics
        run: |
          python docs/win/football/nfl/scripts/training/step6.py

      - name: Add Week 1 prior-season team and QB statistics
        run: |
          python docs/win/football/nfl/scripts/training/step7.py

      - name: Add rest difference and historical travel values
        run: |
          python docs/win/football/nfl/scripts/training/step9.py

      - name: Add historical depth and injury features
        run: |
          python docs/win/football/nfl/scripts/training/step10.py

      - name: Train Step 11 market-relative v3 models
        run: |
          python docs/win/football/nfl/scripts/training/step11.py

      - name: Run Step 13 market-relative v3 backtest
        run: |
          python docs/win/football/nfl/scripts/training/step13.py --reset

      - name: Run Step 14 nested market-baseline validation
        run: |
          python docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Print v3 validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/win/football/nfl/models/step14_market_relative_validation_v3.json")
          data = json.loads(path.read_text())
          print("Overall cutover recommendation:", data["overall_recommended_for_cutover"])
          for market, result in data["markets"].items():
              print(market.upper(), "alpha=", result["production_alpha"], "brier_gain=", result["chronological_brier_gain_vs_market"], "logloss_gain=", result["chronological_logloss_gain_vs_market"], "fold_wins=", f"{result['chronological_fold_wins']}/{len(result['folds'])}", "cutover=", result["recommended_for_cutover"])
              if market in {"spread", "total"}:
                  print(market.upper(), "fair-edge audits:", result["betting_audits"])
          PY

      - name: Commit v3 training outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/nfl/training/historical_core_20??.csv
          git add docs/win/football/nfl/training/backtests/step13_market_relative_backtest_v3.csv
          git add docs/win/football/nfl/training/backtests/step14_market_relative_probabilities_v3.csv
          git add docs/win/football/nfl/models/step11_market_relative_feature_schema_v3.json
          git add docs/win/football/nfl/models/step11_spread_residual_model_v3.cbm
          git add docs/win/football/nfl/models/step11_total_residual_model_v3.cbm
          git add docs/win/football/nfl/models/step11_moneyline_adjustment_model_v3.cbm
          git add docs/win/football/nfl/models/step11_spread_adjustment_model_v3.cbm
          git add docs/win/football/nfl/models/step11_total_adjustment_model_v3.cbm
          git add docs/win/football/nfl/models/step14_market_relative_validation_v3.json
          if git diff --cached --quiet; then
            echo "No v3 training output changes to commit."
          else
            git commit -m "Build NFL market-relative v3 models"
            git push
          fi
