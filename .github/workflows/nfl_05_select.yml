name: NFL 05 Select

# MANUAL RUN ONLY.
#
# Runs the NFL candidate enrichment engine after projection.py /
# projection_week1.py has added the model prediction fields.
#
# Step 1:
# - reads settings.yaml
# - reads the projected weekly 01_merge CSV
# - reads the current weekly sportsbook schedule
# - calculates implied probability, edge, EV, and Kelly
# - preserves raw HOME/AWAY/OVER/UNDER candidate metrics
# - appends candidate fields without applying betting filters
# - writes the weekly candidate CSV under 02_select
#
# Step 2:
# - reads the weekly 02_select candidate CSV
# - reads config/markets.yaml
# - applies market, side, line, odds, edge, EV, Kelly, and probability filters
# - applies pick_preference
# - writes the final weekly picks CSV under 03_picks
#
# Both outputs are committed back to the repository.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        default: "2026"
        type: string

      week:
        description: "NFL week"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  nfl-select:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Run NFL selection engine
        run: |
          python docs/win/football/nfl/scripts/02_select/selections.py \
            --season "${{ inputs.season }}" \
            --week "${{ inputs.week }}"

      - name: Run NFL picks filter
        run: |
          python docs/win/football/nfl/scripts/03_picks/picks.py \
            --pattern "week_${{ inputs.week }}_NFL_selected.csv"

      - name: Commit selection and picks outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SELECT_OUTPUT="docs/win/football/nfl/02_select/week_${{ inputs.week }}_NFL_selected.csv"
          PICKS_OUTPUT="docs/win/football/nfl/03_picks/week_${{ inputs.week }}_NFL_picks.csv"

          if [ ! -f "$SELECT_OUTPUT" ]; then
            echo "ERROR: Expected selection output not found:"
            echo "$SELECT_OUTPUT"
            exit 1
          fi

          if [ ! -f "$PICKS_OUTPUT" ]; then
            echo "ERROR: Expected picks output not found:"
            echo "$PICKS_OUTPUT"
            exit 1
          fi

          git add "$SELECT_OUTPUT"
          git add "$PICKS_OUTPUT"

          if git diff --cached --quiet; then
            echo "No selection or picks output changes to commit."
          else
            git commit -m "Run NFL selections and picks for ${{ inputs.season }} Week ${{ inputs.week }}"
            git push
          fi
