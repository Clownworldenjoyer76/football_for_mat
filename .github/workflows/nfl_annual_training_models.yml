name: NFL Annual Training Models

# MANUAL RUN ONLY.
#
# Rebuilds historical training data through Step 10, then builds the isolated
# v2 candidate stack:
#   Step 4  - removes static outcome-mined enrichment features
#   Step 11 - trains clean market-residual regressors + direct classifiers
#   Step 13 - expanding-season out-of-fold backtest
#   Step 14 - chronological probability calibration + total betting audit
#
# v2 artifacts are intentionally separate from the current live model files so
# the replacement can be validated before production cutover.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nfl-leak-free-v2
    paths:
      - docs/win/football/nfl/training/RUN_V2_TRIGGER.txt

permissions:
  contents: write

jobs:
  annual-training-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy catboost

      - name: Compile rebuilt training scripts
        run: |
          python -m py_compile \
            docs/win/football/nfl/scripts/training/step4.py \
            docs/win/football/nfl/scripts/training/step11.py \
            docs/win/football/nfl/scripts/training/step13.py \
            docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Run historical core build
        run: |
          python docs/win/football/nfl/scripts/training/step1.py

      - name: Add historical odds and weather fields
        run: |
          python docs/win/football/nfl/scripts/training/step2.py

      - name: Add final-game targets
        run: |
          python docs/win/football/nfl/scripts/training/step3.py

      - name: Remove outcome-mined enrichment leakage
        run: |
          python docs/win/football/nfl/scripts/training/step4.py

      - name: Add lagged team statistics
        run: |
          python docs/win/football/nfl/scripts/training/step5.py

      - name: Split historical training table by season
        run: |
          python docs/win/football/nfl/scripts/training/step5_split.py

      - name: Add lagged QB statistics
        run: |
          python docs/win/football/nfl/scripts/training/step6.py

      - name: Add Week 1 prior-season team and QB statistics
        run: |
          python docs/win/football/nfl/scripts/training/step7.py

      - name: Add rest difference and historical travel values
        run: |
          python docs/win/football/nfl/scripts/training/step9.py

      - name: Add historical depth and injury features
        run: |
          python docs/win/football/nfl/scripts/training/step10.py

      - name: Train Step 11 leak-free v2 models
        run: |
          python docs/win/football/nfl/scripts/training/step11.py

      - name: Run Step 13 chronological v2 backtest
        run: |
          python docs/win/football/nfl/scripts/training/step13.py --reset

      - name: Build Step 14 chronological v2 calibration
        run: |
          python docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Print v2 total diagnostic summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/win/football/nfl/models/step14_probability_calibration_v2.json")
          data = json.loads(path.read_text())
          total = data["calibrations"]["total"]["diagnostics"]
          audit = data["chronological_betting_diagnostics"]["total_positive_quoted_ev_zero_threshold"]

          print("TOTAL raw OOF:", total["raw_all_oof"])
          print("TOTAL chronological raw same rows:", total["chronological_raw_same_rows"])
          print("TOTAL chronological calibrated:", total["chronological_calibrated"])
          print("TOTAL positive-EV betting audit:", audit)
          PY

      - name: Commit v2 training outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/nfl/training/historical_core_20??.csv
          git add docs/win/football/nfl/training/backtests/step13_chronological_backtest_v2.csv
          git add docs/win/football/nfl/training/backtests/step14_chronological_probabilities_v2.csv
          git add docs/win/football/nfl/models/step11_clean_feature_schema.json
          git add docs/win/football/nfl/models/step11_spread_residual_model_v2.cbm
          git add docs/win/football/nfl/models/step11_total_residual_model_v2.cbm
          git add docs/win/football/nfl/models/step11_moneyline_probability_model_v2.cbm
          git add docs/win/football/nfl/models/step11_spread_probability_model_v2.cbm
          git add docs/win/football/nfl/models/step11_total_probability_model_v2.cbm
          git add docs/win/football/nfl/models/step14_probability_calibration_v2.json

          if git diff --cached --quiet; then
            echo "No v2 training output changes to commit."
          else
            git commit -m "Build NFL leak-free v2 models"
            git push
          fi
