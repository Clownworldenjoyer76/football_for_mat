name: NFL Market-Independent V4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nfl-market-independent-v4
    paths:
      - docs/win/football/nfl/training/V4_BUILD_TRIGGER.txt

permissions:
  contents: write

jobs:
  v4-market-independent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy catboost

      - name: Compile v4 scripts
        run: |
          python -m py_compile \
            docs/win/football/nfl/scripts/training/v4_common.py \
            docs/win/football/nfl/scripts/training/step11_market_independent_v4.py \
            docs/win/football/nfl/scripts/training/step13_market_independent_v4.py \
            docs/win/football/nfl/scripts/training/step14_market_independent_v4.py

      - name: Verify historical training inputs
        run: |
          for y in 2021 2022 2023 2024 2025; do
            test -s "docs/win/football/nfl/training/historical_core_${y}.csv"
          done

      - name: Train v4 market-independent models
        run: python docs/win/football/nfl/scripts/training/step11_market_independent_v4.py --start-season 2021 --end-season 2025

      - name: Run v4 chronological OOF backtest
        run: python docs/win/football/nfl/scripts/training/step13_market_independent_v4.py --start-season 2021 --end-season 2025

      - name: Validate and calibrate v4
        run: python docs/win/football/nfl/scripts/training/step14_market_independent_v4.py

      - name: Print v4 decision summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/win/football/nfl/models/step14_market_independent_validation_v4.json').read_text())
          print('selected:', d['final_selected_variants'])
          print('gates:', d['gates'])
          print('overall_candidate_pass:', d['overall_candidate_pass'])
          print('chronological:', d['nested_chronological_metrics'])
          print('baselines:', d['nested_chronological_baselines'])
          PY

      - name: Commit v4 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/win/football/nfl/models/step11_*_v4.cbm \
            docs/win/football/nfl/models/step11_market_independent_feature_schema_v4.json \
            docs/win/football/nfl/models/step14_market_independent_validation_v4.json \
            docs/win/football/nfl/models/step14_error_distributions_v4.json \
            docs/win/football/nfl/training/backtests/step13_market_independent_backtest_v4.csv \
            docs/win/football/nfl/training/backtests/step14_market_independent_probabilities_v4.csv
          if git diff --cached --quiet; then
            echo "No v4 output changes to commit."
          else
            git commit -m "Build NFL market-independent v4 models"
            git push
          fi
