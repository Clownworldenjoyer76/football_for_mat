name: Enrich NFL Predictions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python docs/win/football/nfl/scripts/00_intake/enrich_moneyline.py

      - run: python docs/win/football/nfl/scripts/00_intake/enrich_spread.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/nfl/00_intake/predictions/enriched/
          git diff --cached --quiet && exit 0
          git commit -m "Update enriched NFL predictions"
          git push origin HEAD:${GITHUB_REF_NAME}
