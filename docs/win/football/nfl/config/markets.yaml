# docs/win/football/nfl/config/markets.yaml
#
# Step 15 market-specific selection rules.
#
# Thresholds not defined in a market inherit from:
#   settings.yaml -> selection_defaults
#
# Supported threshold overrides:
#   min_ev
#   min_edge
#   min_kelly
#   max_kelly
#   min_odds_american
#   max_odds_american
#   min_model_prob
#   max_model_prob

markets:

  moneyline:
    enabled: true
    home_only: false
    away_only: false
    favorite_only: false
    underdog_only: false

    # Optional examples of market-specific overrides:
    # min_ev: 0.02
    # min_model_prob: 0.55
    # max_kelly: 0.03


  spread:
    enabled: true
    max_spread_abs: 100.0

    home_only: false
    away_only: false
    favorite_only: false
    underdog_only: false

    # Optional examples of market-specific overrides:
    # min_ev: 0.02
    # min_edge: 0.02
    # max_kelly: 0.03


  total:
    enabled: true
    min_total: 0.0
    max_total: 100.0

    # Weather restrictions apply to non-dome games.
    # If omitted, allow_missing_weather inherits
    # settings.yaml -> game_filters -> allow_weather_missing.
    max_wind_speed: 999
    max_gust_speed: 999
    allow_precipitation: true

    dome_only: false
    open_air_only: false

    # Optional examples of market-specific overrides:
    # min_ev: 0.02
    # min_edge: 0.02
    # max_kelly: 0.03
