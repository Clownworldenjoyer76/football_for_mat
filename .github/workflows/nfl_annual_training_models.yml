name: NFL Annual Training Models

# MANUAL RUN ONLY.
#
# Rebuilds historical data through Step 10, then trains and validates the
# market-independent v4 production model family.
#
# V4 predicts football outcomes without sportsbook lines/prices as model
# inputs or targets. Historical market fields are used only as benchmarks.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annual-training-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy catboost

      - name: Compile v4 training scripts
        run: |
          python -m py_compile \
            docs/win/football/nfl/scripts/training/v4_common.py \
            docs/win/football/nfl/scripts/training/step11_market_independent_v4.py \
            docs/win/football/nfl/scripts/training/step13_market_independent_v4.py \
            docs/win/football/nfl/scripts/training/step14_market_independent_v4.py \
            docs/win/football/nfl/scripts/training/step11.py \
            docs/win/football/nfl/scripts/training/step13.py \
            docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Run historical core build
        run: python docs/win/football/nfl/scripts/training/step1.py

      - name: Add historical odds and weather fields
        run: python docs/win/football/nfl/scripts/training/step2.py

      - name: Add final-game targets
        run: python docs/win/football/nfl/scripts/training/step3.py

      - name: Apply historical enrichment rules
        run: python docs/win/football/nfl/scripts/training/step4.py

      - name: Add lagged team statistics
        run: python docs/win/football/nfl/scripts/training/step5.py

      - name: Split historical training table by season
        run: python docs/win/football/nfl/scripts/training/step5_split.py

      - name: Add lagged QB statistics
        run: python docs/win/football/nfl/scripts/training/step6.py

      - name: Add Week 1 prior-season team and QB statistics
        run: python docs/win/football/nfl/scripts/training/step7.py

      - name: Add rest difference and historical travel values
        run: python docs/win/football/nfl/scripts/training/step9.py

      - name: Add historical depth and injury features
        run: python docs/win/football/nfl/scripts/training/step10.py

      - name: Train v4 football outcome models
        run: python docs/win/football/nfl/scripts/training/step11.py

      - name: Run v4 chronological backtest
        run: python docs/win/football/nfl/scripts/training/step13.py

      - name: Build v4 probability calibration and gates
        run: python docs/win/football/nfl/scripts/training/step14_calibration.py

      - name: Commit annual v4 training outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/football/nfl/training/historical_core_20??.csv
          git add docs/win/football/nfl/training/backtests/step13_market_independent_backtest_v4.csv
          git add docs/win/football/nfl/training/backtests/step14_market_independent_probabilities_v4.csv
          git add docs/win/football/nfl/models/step11_*_v4.cbm
          git add docs/win/football/nfl/models/step11_market_independent_feature_schema_v4.json
          git add docs/win/football/nfl/models/step14_error_distributions_v4.json
          git add docs/win/football/nfl/models/step14_market_independent_validation_v4.json

          if git diff --cached --quiet; then
            echo "No annual v4 training output changes to commit."
          else
            git commit -m "Build NFL annual v4 training models"
            git push
          fi
