# NFL Prop Engine model acceptance thresholds.
#
# Thresholds were populated only after the first chronological backtest:
# - model-selection training through 2023
# - chronological validation on 2024
# - 2025 held out for reporting only and not used to set these thresholds
#
# Derivation for target-level gates:
# - minimum_training_rows = first-backtest model-selection training rows
# - maximum_allowed_bias = 20% of selected validation MAE
# - maximum_validation_mae = 105% of selected validation MAE
# - minimum_improvement_vs_baseline_pct = 90% of observed validation improvement
# - count metric ceilings = 105% of observed selected validation metric when recorded
#
# Kicking points is a derived count but was selected/evaluated as regression in the
# first architecture backtest, so its Brier/Poisson gates are conservative numeric
# gates that must be independently measured before production approval.
#
# This file defines gates only. It does not grant production approval.

