name: test NFL Prop Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prop-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run prop odds
        run: python docs/win/football/nfl/prop_engine/scripts/prop_odds.py

      - name: Build prop selections
        run: python docs/win/football/nfl/prop_engine/scripts/build_prop_selections.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/nfl/prop_engine/output/
          git diff --cached --quiet || git commit -m "Update NFL prop odds and selections"
          git push
