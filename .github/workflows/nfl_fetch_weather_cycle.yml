name: NFL Fetch Weather

on:
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fetch_weather.py
        run: python docs/win/football/nfl/scripts/00_intake/fetch_weather.py

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/win/football/nfl/data/weather/
          git add docs/win/football/nfl/errors/00_intake/fetch_weather.txt
          git diff --cached --quiet || git commit -m "Update NFL weather data"
          git push
